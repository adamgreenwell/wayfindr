version: 2

updates:
  - package-ecosystem: composer
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    # apps/server carried a package.json until fc47fb19 (2026-08-19) unified the
    # design-token pipeline and removed it. The widget is the only npm manifest
    # in the tree now; the deploy scripts say the same thing by skipping the
    # frontend build when no package-lock.json is present.
    directory: /packages/widget-js
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope
