name: Disposable VM evidence

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Public-artifact scenario to run on a fresh Ubuntu 24.04 runner.
        required: true
        default: clean-install-latest
        type: choice
        options:
          - clean-install-latest
          - upgrade-v0.2.0-latest-custom-backup-queue
          - recovery-latest-synthetic-skew-restore
          - upgrade-v0.1.0-latest
          - upgrade-v0.1.0-v0.2.0-latest

permissions:
  contents: read

concurrency:
  group: disposable-vm-evidence-${{ github.event.inputs.scenario }}
  cancel-in-progress: false

jobs:
  public-artifact:
    name: Public artifact evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the evidence harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4 for smoke helpers
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.4"
          coverage: none

      - name: Run public artifact evidence
        env:
          WAYFINDR_EVIDENCE_SCENARIO: ${{ github.event.inputs.scenario }}
          WAYFINDR_EVIDENCE_PROJECT: wayfindr-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          WAYFINDR_EVIDENCE_APP_URL: http://127.0.0.1:18080
        run: scripts/smoke/public-artifact-install.sh
