# Source-build overlay for repo checkouts:
#
#   docker compose -f docker/self-hosting/compose.yml \
#     -f docker/self-hosting/compose.build.yml \
#     --env-file docker/self-hosting/.env up -d --build
#
# The published compose.yml is pull-only because the installer places it in a
# directory with no source tree.
services:
  web:
    build:
      context: ../..
      dockerfile: docker/self-hosting/server.Dockerfile
      args:
        PHP_VERSION: ${WAYFINDR_PHP_VERSION:-8.4}
        NODE_VERSION: ${WAYFINDR_NODE_VERSION:-24}
        # Left unset, a source build derives `<VERSION>-dev` from the committed
        # VERSION file (ADR 0012). Pass the commit to pin the exact build, which
        # is what makes the identity comparable — a bare `-dev` names a lineage,
        # not a build, so version checks treat it as unverifiable:
        #
        #   WAYFINDR_BUILD_COMMIT=$(git rev-parse HEAD) docker compose ... --build
        WAYFINDR_VERSION: ${WAYFINDR_BUILD_VERSION:-}
        WAYFINDR_COMMIT: ${WAYFINDR_BUILD_COMMIT:-}
