; PHP limits for the Wayfindr image.
;
; The base image ships PHP's compiled-in defaults, which are 2M per file and
; 8M per request -- below what the application itself accepts. Without this
; file a visitor attaching a 4 MB screenshot is refused by PHP before any
; Wayfindr limit is consulted, on a stack whose own configuration says 10 MB
; is fine.
;
; Sized from the application's defaults:
;   WAYFINDR_ATTACHMENT_MAX_FILE_BYTES   10 MiB per file
;   WAYFINDR_ATTACHMENT_MAX_PER_MESSAGE  5 files
;
; post_max_size bounds the WHOLE request -- every attachment, the message
; body, and multipart overhead together -- so it needs headroom above
; 5 x 10 MiB rather than matching one file. Exceeding it does not produce a
; large upload, it produces NO request body at all: PHP discards the multipart
; body, so an inbound-mail delivery arrives with no signature fields and is
; answered 401 rather than the 422 that would have had it retried.
;
; memory_limit sits above post_max_size because an inbound mail delivery holds
; its attachments in memory while it stores them.
upload_max_filesize = 10M
post_max_size = 64M
memory_limit = 256M
